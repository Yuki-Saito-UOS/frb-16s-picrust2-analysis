[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ricebran-analysis"
version = "0.2.1"
description = "Reproducible FRB 16S rRNA predicted-metagenome analysis"
readme = "README.md"
requires-python = ">=3.12.3,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "matplotlib==3.10.8",
  "numpy==2.2.5",
  "pandas==2.3.2",
  "pypdf==6.16.2",
  "scipy==1.17.1",
  "statsmodels==0.14.6",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]

[project.urls]
Repository = "https://github.com/Yuki-Saito-UOS/frb-16s-picrust2-analysis"

[project.scripts]
ricebran-analysis = "ricebran_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
